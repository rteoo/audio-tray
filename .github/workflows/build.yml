name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build AudioPriorityTray.slnx -c Release

      - name: Test
        run: dotnet test --project tests/AudioPriorityTray.Core.Tests -c Release --no-build

      - name: Publish
        shell: pwsh
        run: |
          # Tags set the version (v1.2.3 -> 1.2.3); other builds keep the project's version.
          $versionArgs = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $versionArgs = @("-p:Version=$($env:GITHUB_REF_NAME.TrimStart('v'))") }

          New-Item -ItemType Directory -Force release | Out-Null
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/AudioPriorityTray -c Release -r $rid -p:PublishSingleFile=true --self-contained false @versionArgs -o "publish/$rid"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item "publish/$rid/AudioPriorityTray.exe" "release/AudioPriorityTray-$rid.exe"
          }
          Get-ChildItem release | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: AudioPriorityTray
          path: release/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: AudioPriorityTray
          path: release

      - name: Nightly release
        if: github.ref == 'refs/heads/main'
        run: |
          # One rolling pre-release that always points at the latest main.
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly release/*.exe \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly build" \
            --notes "Automated build of the latest commit on main ($GITHUB_SHA). Requires the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0)."

      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Creating a release in the GitHub UI also pushes its tag, so the release may already
          # exist; attach the assets to it instead of failing.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.exe \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
